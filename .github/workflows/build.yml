name: Build

# 手动触发（Actions 页 → Build → Run workflow）以及推 master 自动跑。
# 原仓库的 workflow 用 actions/*@v3，其中 upload-artifact@v3 已被 GitHub 停用，
# 跑起来必然失败；这里统一升到 v4。
on:
  workflow_dispatch:
  push:
    branches: [ master ]
    paths-ignore:
      - 'README.md'
      - '**.md'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # ⚠️ 装 SDK 组件必须在 setup-java **之前** ——
      #   顺序反了会直接挂：runner 自带的 sdkmanager（cmdline-tools;latest）是用
      #   JDK 17 编的（class file 61.0），而下面为了 AGP 7.2.2 要把 JAVA_HOME 切到
      #   JDK 11（只认到 55.0）→ UnsupportedClassVersionError。
      #   所以：先用 runner 默认的 JDK 17 把组件装好，再切 11 编译。
      #
      #   必须显式装这些，runner 上缺一个就编不过：
      #     platforms;android-33   compileSdk 33
      #     build-tools;33.0.2     与 AGP 7.2.2 匹配
      #     cmake;3.18.1           module/build.gradle 里写死了这个版本
      #     ndk;23.1.7779620       module/build.gradle 里 pin 的 NDK
      #                            （AGP 7.2.2 默认是 21.4.7075529，runner 上没有）
      - name: 安装 Android SDK 组件
        run: |
          set -e
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" --install "platforms;android-33" "build-tools;33.0.2" \
                        "cmake;3.18.1" "ndk;23.1.7779620"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'          # AGP 7.2.2 只认 JDK 11；17 会直接报错
          cache: gradle

      - name: 打印环境（排查用）
        run: |
          echo "JAVA_HOME=$JAVA_HOME"
          java -version 2>&1 | head -2
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/ndk" 2>/dev/null || true
          ls "$ANDROID_HOME/cmake" 2>/dev/null || true

      - name: 构建（assembleRelease 会自动触发 zipRelease 打包 Magisk 模块）
        run: |
          chmod +x ./gradlew
          ./gradlew :module:assembleRelease --no-daemon --stacktrace

      - name: 列出产物
        run: |
          echo "=== out/ ==="
          ls -lR out | head -60

      # 两个产物都传：
      #   zygisk-imgui-modmenu     解包后的模块目录（module.prop + zygisk/*.so）
      #   zygisk-imgui-modmenu-zip 可直接 magisk --install-module 的 zip
      - uses: actions/upload-artifact@v4
        with:
          name: zygisk-imgui-modmenu
          path: out/magisk_module_release/
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: zygisk-imgui-modmenu-zip
          path: out/*.zip
          if-no-files-found: warn
